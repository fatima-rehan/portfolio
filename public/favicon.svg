<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="heartFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b4b"/>
      <stop offset="40%" stop-color="#e81919"/>
      <stop offset="100%" stop-color="#870b16"/>
    </linearGradient>
    <radialGradient id="heartHighlight" cx="30%" cy="20%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.9)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.0)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.0)"/>
    </radialGradient>
  </defs>

  <!-- soft glow -->
  <ellipse cx="16" cy="19.5" rx="11" ry="8" fill="rgba(232,25,25,0.35)"/>

  <!-- main heart -->
  <path
    d="M16 27.5c-.3 0-.6-.1-.8-.3C14.1 26 5 18.3 5 11.7 5 8.4 7.4 6 10.4 6c2.1 0 3.8 1.1 4.6 2.4.8-1.3 2.5-2.4 4.6-2.4 3 0 5.4 2.4 5.4 5.7 0 6.6-9.1 14.3-10.2 15.5-.2.2-.5.3-.8.3z"
    fill="url(#heartFill)"
    stroke="#2b0609"
    stroke-width="0.7"
  />

  <!-- glossy highlight -->
  <path
    d="M11.2 8.2c-1.7 0-3 1.3-3 3 0 1.9 1.4 3.7 3.6 5.2"
    fill="none"
    stroke="rgba(255,255,255,0.65)"
    stroke-width="0.7"
    stroke-linecap="round"
  />

  <!-- inner glow -->
  <path
    d="M16 27.5c-.3 0-.6-.1-.8-.3C14.1 26 5 18.3 5 11.7 5 8.4 7.4 6 10.4 6c2.1 0 3.8 1.1 4.6 2.4.8-1.3 2.5-2.4 4.6-2.4 3 0 5.4 2.4 5.4 5.7 0 6.6-9.1 14.3-10.2 15.5-.2.2-.5.3-.8.3z"
    fill="url(#heartHighlight)"
  />
</svg>
